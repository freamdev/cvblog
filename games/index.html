<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Playable browser games and game-development projects by Freamdev."
    />
    <title>Games · Freamdev</title>
    <link rel="stylesheet" href="../assets/css/site.css" />
  </head>
  <body data-page="games">
    <div id="site-header"></div>
    <main id="main">
      <header class="page-hero">
        <div class="shell">
          <p class="eyebrow">Games collection</p>
          <h1>Games built to be explored.</h1>
          <p>
            Play browser games and discover earlier game projects, all in one
            place.
          </p>
        </div>
      </header>
      <section class="section">
        <div class="shell">
          <div class="filter-bar" aria-label="Filter games">
            <button class="filter-button active" data-filter="all">All</button
            ><button class="filter-button" data-filter="playable">
              Playable</button
            ><button class="filter-button" data-filter="article">
              With articles</button
            ><button class="filter-button" data-filter="unity">Unity</button
            ><button class="filter-button" data-filter="game jam">
              Game jam</button
            ><button class="filter-button" data-filter="2d">2D</button>
          </div>
          <div id="game-grid" class="grid"></div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script>
      window.SITE_ROOT = "../";
    </script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/site.js"></script>
  </body>
</html>
